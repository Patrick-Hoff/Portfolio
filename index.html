<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfólio | Desenvolvedor Full Stack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0F172A;
      color: #fff;
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #0F172A;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
      border-bottom: 1px solid #1E293B;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
    }

    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #38BDF8;
    }

    .btn {
      background-color: #38BDF8;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      color: #0F172A;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: #0ea5e9;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8rem 2rem 2rem;
      min-height: 100vh;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .hero-text {
      flex: 1;
      max-width: 500px;
    }

    .hero-text h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero-text p {
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hero-img {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .hero-img img {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <header>
    <h2>Nome</h2>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">Sobre</a>
      <a href="#">Projetos</a>
      <a href="#">Contato</a>
    </nav>
    <button class="btn">Download CV</button>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>Olá, eu sou um Desenvolvedor Full Stack</h1>
      <p>Construindo soluções web modernas com foco em performance e usabilidade.</p>
      <div class="hero-buttons">
        <button class="btn">Baixar CV</button>
        <button class="btn" style="background:#1E293B; color:#fff; border: 1px solid #38BDF8;">Ver Projetos</button>
      </div>
    </div>
    <div class="hero-img">
      <img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png" alt="Ilustração de Dev" />
    </div>
  </section>
</body>
</html>
