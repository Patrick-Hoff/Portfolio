<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensagem Enviada | Patrick Hoffmann Campos</title>
  <link rel="icon" type="image/png" href="icon/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style/style.css" />
  <style>
    .thanks-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 2rem;
    }

    .thanks-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .thanks-orb-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59,130,246,0.14), transparent 68%);
      border-radius: 50%;
      filter: blur(80px);
      top: -150px;
      left: -150px;
    }

    .thanks-orb-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(139,92,246,0.12), transparent 68%);
      border-radius: 50%;
      filter: blur(80px);
      bottom: -100px;
      right: -100px;
    }

    .thanks-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 3.5rem;
      text-align: center;
      max-width: 500px;
      width: 100%;
      position: relative;
      z-index: 1;
      box-shadow: var(--shadow-lg);
      animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    .thanks-icon {
      width: 72px;
      height: 72px;
      background: rgba(34, 197, 94, 0.1);
      border: 2px solid rgba(34, 197, 94, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.75rem;
      font-size: 1.8rem;
      color: #22C55E;
      animation: iconBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
    }

    @keyframes iconBounce {
      from { opacity: 0; transform: scale(0.4); }
      to   { opacity: 1; transform: scale(1); }
    }

    .thanks-error-icon {
      width: 72px;
      height: 72px;
      background: rgba(239, 68, 68, 0.1);
      border: 2px solid rgba(239, 68, 68, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.75rem;
      font-size: 1.8rem;
      color: #EF4444;
      animation: iconBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
    }

    .thanks-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }

    .thanks-message {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.75;
      margin-bottom: 2rem;
    }

    .thanks-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--gradient-accent);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 28px rgba(59,130,246,0.2);
    }

    .thanks-back:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 36px rgba(59,130,246,0.38);
    }
  </style>
</head>
<body>

  <div class="thanks-page">
    <div class="thanks-bg" aria-hidden="true">
      <div class="thanks-orb-1"></div>
      <div class="thanks-orb-2"></div>
    </div>

    <!-- Success state -->
    <div class="thanks-card" id="success" style="display:none;">
      <div class="thanks-icon">
        <i class="fas fa-check"></i>
      </div>
      <h1 class="thanks-title">Mensagem <span class="gradient-text">Enviada!</span></h1>
      <p class="thanks-message">
        Obrigado pelo contato, sua mensagem foi recebida com sucesso.<br>
        Entrarei em contato o mais breve possível.
      </p>
      <a href="index.html#contact" class="thanks-back">
        <i class="fas fa-arrow-left"></i>
        Voltar ao Portfólio
      </a>
    </div>

    <!-- Unauthorized state -->
    <div class="thanks-card" id="unauthorized" style="display:none;">
      <div class="thanks-error-icon">
        <i class="fas fa-exclamation"></i>
      </div>
      <h1 class="thanks-title">Acesso <span class="gradient-text">Inválido</span></h1>
      <p class="thanks-message">
        Esta página só pode ser acessada após o envio do formulário de contato.
      </p>
      <a href="index.html#contact" class="thanks-back">
        <i class="fas fa-arrow-left"></i>
        Ir para o Contato
      </a>
    </div>
  </div>

  <script>
    const isFromFormSubmit = document.referrer.includes('formsubmit.co');
    document.getElementById(isFromFormSubmit ? 'success' : 'unauthorized').style.display = 'block';
  </script>
</body>
</html>
